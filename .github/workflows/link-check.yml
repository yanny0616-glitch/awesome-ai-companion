name: Link Check

on:
  schedule:
    - cron: '0 3 * * 1'  # Every Monday 03:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  linkChecker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check links
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --accept 200,204,206,301,302,308,429
            --max-concurrency 4
            --timeout 20
            --retry-wait-time 10
            README.md README.zh-CN.md
          fail: false

      # Broken links are reported, not treated as a failed run: an issue when
      # the repository has Issues enabled (forks usually don't), otherwise a
      # warning that points at the job summary lychee already wrote.
      - name: Check whether Issues are enabled
        id: repo
        if: steps.lychee.outputs.exit_code != 0
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "has_issues=$(gh api "repos/${GITHUB_REPOSITORY}" --jq .has_issues)" >> "$GITHUB_OUTPUT"

      - name: Create issue on broken links
        if: steps.lychee.outputs.exit_code != 0 && steps.repo.outputs.has_issues == 'true'
        uses: peter-evans/create-issue-from-file@v6
        with:
          title: '🔗 Broken links detected'
          content-filepath: ./lychee/out.md
          labels: |
            link-check
            automated

      - name: Report broken links without Issues
        if: steps.lychee.outputs.exit_code != 0 && steps.repo.outputs.has_issues != 'true'
        run: echo "::warning title=Broken links::lychee found broken links; Issues are disabled here, so see the job summary for the list."
